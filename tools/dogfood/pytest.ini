[pytest]
# Run from the repository root: uv run --exclude-newer "7 days" --with pytest pytest tools/dogfood
# (-m unit or -m integration picks one kind; conftest.py marks every test)
addopts = -p no:cacheprovider
testpaths = .
markers =
    unit: pure functions and parsers, no process is run
    integration: runs the fake shizuku binary from conftest.py
